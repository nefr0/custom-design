<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bad page</title>
<style>
body { background: #f5f0e6; }
.card { border-left: 4px solid #e11d48; border-radius: 12px; box-shadow: 0 0 24px rgba(124, 58, 237, 0.5); padding: 16px; background: #fff; }
.card .card { border: 1px solid #ddd; }
.title { background: linear-gradient(90deg, #7c3aed, #06b6d4); -webkit-background-clip: text; color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.btn { transition: width 0.3s cubic-bezier(0.68, -0.6, 0.32, 1.6); }
.note { background: #7c3aed; color: #888888; }
</style>
</head>
<body>
<h1 class="title">Welcome</h1>
<h3>Skipped a level</h3>
<div class="card"><p>Body copy inside a card that is long enough to count as text.</p><div class="card"><p>Inner card text, also long enough.</p></div></div>
<span class="dot"></span>
<p class="note">Gray text on a purple surface.</p>
<img src="">
</body>
</html>
