<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticky header with backdrop blur</title>
<style>
body { margin: 0; font-family: sans-serif; background: #f5f5f7; color: #1c1c1e; }
header { position: sticky; top: 0; padding: 16px 24px; background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px); }
h1 { margin: 0; font-size: 22px; font-weight: 700; color: #1c1c1e; }
main { padding: 24px; max-width: 60ch; }
</style>
</head>
<body>
<header><h1>Security</h1></header>
<main><p>Readable body copy under a blurred header.</p></main>
</body>
</html>
